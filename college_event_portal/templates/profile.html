{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Student Profile</h1>
</div>

<div class="profile-card">
    <div class="profile-avatar">
        {{ user.name[0] }}
    </div>
    <h2 class="profile-name">{{ user.name }}</h2>
    <div class="profile-id">{{ user.student_id }}</div>
    
    <div class="profile-details-grid">
        <div class="profile-item">
            <div class="profile-item-label">Email</div>
            <div class="profile-item-value">{{ user.email }}</div>
        </div>
        <div class="profile-item">
            <div class="profile-item-label">Course</div>
            <div class="profile-item-value">{{ user.course }}</div>
        </div>
        <div class="profile-item">
            <div class="profile-item-label">Year</div>
            <div class="profile-item-value">{{ user.year }}</div>
        </div>
        <div class="profile-item">
            <div class="profile-item-label">Contact</div>
            <div class="profile-item-value">{{ user.contact }}</div>
        </div>
    </div>
</div>
{% endblock %}
